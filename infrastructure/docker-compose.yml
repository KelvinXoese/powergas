version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: powergas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-powergas}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${DB_NAME:-powergas_db}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-powergas}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - powergas-net

  redis:
    image: redis:7-alpine
    container_name: powergas-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - powergas-net

  minio:
    image: minio/minio:latest
    container_name: powergas-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadmin}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    networks:
      - powergas-net

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: powergas-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - ../backend/.env
    ports:
      - '3000:3000'
    networks:
      - powergas-net

  nginx:
    image: nginx:alpine
    container_name: powergas-nginx
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - powergas-net

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  powergas-net:
    driver: bridge
