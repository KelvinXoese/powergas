user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
  worker_connections 4096;
  use epoll;
  multi_accept on;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # ── Logging ──
  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" "$http_user_agent" rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # ── Performance ──
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 65;
  client_max_body_size 10M;

  # ── Compression ──
  gzip on;
  gzip_types text/plain application/json application/javascript text/css;
  gzip_min_length 1000;

  # ── Rate Limiting ──
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

  # ── Upstream (horizontal scaling — add more backend instances here) ──
  upstream powergas_backend {
    least_conn;
    server backend:3000 max_fails=3 fail_timeout=30s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── API ──
    location /api/ {
      limit_req zone=api_limit burst=40 nodelay;
      limit_conn conn_limit 20;
      proxy_pass http://powergas_backend;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_connect_timeout 5s;
      proxy_read_timeout 60s;
    }

    # ── WebSocket (Socket.IO tracking) ──
    location /socket.io/ {
      proxy_pass http://powergas_backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 3600s;
    }

    location /health {
      proxy_pass http://powergas_backend/api/v1/health;
      access_log off;
    }
  }
}
